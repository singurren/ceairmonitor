[project]
name = "ceair"
version = "0.1.0"
description = "China Eastern fun pass monitor with date-level polling and browser-side flight probing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
browser = [
    "playwright>=1.58.0",
]

[project.scripts]
ceair-monitor = "ceair.monitor:main"
ceair-save-state = "ceair.browser:main_save_storage_state"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ceair*"]
