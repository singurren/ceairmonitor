[project]
name = "ceair"
version = "0.1.0"
description = "China Eastern coupon monitor with date polling and Chrome extension flight confirmation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ceair-monitor = "ceair.monitor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ceair*"]
